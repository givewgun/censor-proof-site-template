# Hardened Zero-Log Static Nginx Config for Tor v3 Onion Origin (ADR-002 / ADR-004)
# Place at /etc/nginx/sites-available/archive-onion and symlink to sites-enabled/
# IMPORTANT: Remove /etc/nginx/sites-enabled/default so nothing binds to public IPs!

server {
    # Bind strictly to loopback — NEVER expose on 0.0.0.0 or public IPv4/IPv6
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root /var/www/archive/site;
    index index.html;

    # Zero visitor logging & hide server version/OS fingerprint
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    autoindex off;

    # Allow only read-only HTTP methods
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Strict Zero-JS, Zero-Form, Zero-External-Resource Security Headers
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Disable ETags and Last-Modified to avoid leaking inode or build/upload timestamps
    etag off;
    if_modified_since off;
    add_header Last-Modified "" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
